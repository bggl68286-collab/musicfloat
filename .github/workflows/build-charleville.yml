name: Build Charleville 1777 Forge Mod
on:
  push:
    branches: [ "charleville-1777-1.20.1" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: "8.8"
      - name: Build Forge mod
        run: |
          mkdir -p /tmp/charleville
          unzip -q charleville1777_1.20.1_forge_project.zip -d /tmp/charleville
          cd /tmp/charleville/charleville1777
          gradle --no-daemon build
      - name: Launch Forge client smoke test
        run: |
          cd /tmp/charleville/charleville1777
          set +e
          timeout 150s xvfb-run -a gradle --no-daemon runClient > /tmp/charleville-client.log 2>&1
          code=$?
          tail -200 /tmp/charleville-client.log
          grep -q "charleville1777" /tmp/charleville-client.log
          test "$code" = "0" -o "$code" = "124"
      - name: Publish built JAR to branch
        run: |
          cp /tmp/charleville/charleville1777/build/libs/*.jar charleville1777-forge-1.20.1.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charleville1777-forge-1.20.1.jar
          git diff --cached --quiet || git commit -m "Publish built Charleville 1777 Forge JAR"
          git push origin HEAD:charleville-1777-1.20.1
      - uses: actions/upload-artifact@v4
        with:
          name: charleville1777-forge-1.20.1
          path: /tmp/charleville/charleville1777/build/libs/*.jar
          if-no-files-found: error
