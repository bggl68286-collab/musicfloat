name: Build Charleville 1777 Forge Mod
on:
  push:
    branches: [ "charleville-1777-1.20.1" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: "8.8"
      - name: Build Forge mod
        run: |
          mkdir -p /tmp/charleville
          unzip -q charleville1777_1.20.1_forge_project.zip -d /tmp/charleville
          cd /tmp/charleville/charleville1777
          gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: charleville1777-forge-1.20.1
          path: /tmp/charleville/charleville1777/build/libs/*.jar
          if-no-files-found: error
